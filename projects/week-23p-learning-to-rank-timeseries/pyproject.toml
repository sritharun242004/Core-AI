[project]
name = "learning-to-rank-timeseries"
version = "0.1.0"
description = "Track P beta — neural LambdaRank, randomized experiments and rolling forecasts"
requires-python = ">=3.13"
dependencies = ["numpy>=2.2", "torch>=2.6"]

[project.optional-dependencies]
dev = ["pytest>=8.3", "ruff>=0.7"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
addopts = "-v --strict-markers"
testpaths = ["tests"]
