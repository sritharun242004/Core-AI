[project]
name = "scaling-dpo-repro"
version = "0.1.0"
description = "Track R beta — bounded scaling and DPO reproductions"
requires-python = ">=3.13"
dependencies = ["numpy>=2.1", "torch>=2.6"]
[project.optional-dependencies]
dev = ["pytest>=8.3", "ruff>=0.7"]
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --strict-markers"
