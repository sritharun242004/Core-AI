[project]
name = "mini-rag-multimodal"
version = "0.1.0"
description = "Week 17 — offline retrieval, graph expansion, denoising, and voice adapters"
requires-python = ">=3.13"
dependencies = ["numpy>=2.1"]

[project.optional-dependencies]
dev = ["pytest>=8.3", "ruff>=0.7", "pyright>=1.1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
addopts = "-v --strict-markers"
testpaths = ["tests"]
pythonpath = ["src"]
