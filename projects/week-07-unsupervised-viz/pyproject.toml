[project]
name = "unsupervised-viz"
version = "0.1.0"
description = "Week 7 — NumPy PCA and k-means with a sklearn unsupervised visualization workflow"
requires-python = ">=3.13"
dependencies = [
  "numpy>=2.1",
  "matplotlib>=3.9",
  "scikit-learn>=1.5",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "ruff>=0.7",
  "pyright>=1.1",
]
umap = ["umap-learn>=0.5.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
addopts = "-v --strict-markers"
testpaths = ["tests"]
