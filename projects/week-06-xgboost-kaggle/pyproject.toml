[project]
name = "xgboost-kaggle"
version = "0.1.0"
description = "Week 6 — offline, leakage-safe Titanic-style XGBoost submission pipeline"
requires-python = ">=3.13"
dependencies = [
  "numpy>=2.1,<3",
  "pandas>=2.2,<4",
  "scikit-learn>=1.6,<2",
  "xgboost>=2.1,<4",
  "matplotlib>=3.9,<4",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "hypothesis>=6.112", "ruff>=0.7", "pyright>=1.1"]

[project.scripts]
titanic-submit = "xgboost_kaggle.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/xgboost_kaggle"]

[tool.pytest.ini_options]
addopts = "-v --strict-markers"
testpaths = ["tests"]
