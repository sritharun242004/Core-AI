[project]
name = "fsdp-ring-lab"
version = "0.1.0"
description = "Week 18 — distributed accounting and differentiable ring-style attention reference"
requires-python = ">=3.13"
dependencies = ["torch>=2.6"]

[project.optional-dependencies]
dev = ["pytest>=8.3", "ruff>=0.7"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
addopts = "-q --strict-markers"
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["src/fsdp_ring_lab"]
