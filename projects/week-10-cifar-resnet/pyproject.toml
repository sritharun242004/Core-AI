[project]
name = "cifar-resnet"
version = "0.1.0"
description = "Week 10 — a dependency-light CIFAR CNN and ResNet lab"
requires-python = ">=3.13"
dependencies = ["torch>=2.1"]

[project.optional-dependencies]
dev = ["pytest>=8.3", "ruff>=0.7", "pyright>=1.1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
addopts = "-v --strict-markers"
testpaths = ["tests"]
