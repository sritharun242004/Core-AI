[project]
name = "mini-bpe-pretrain"
version = "0.1.0"
description = "Week 14 — deterministic BPE, positional encodings, and tiny pretraining"
requires-python = ">=3.13"
dependencies = ["torch>=2.5"]

[project.optional-dependencies]
dev = ["pytest>=8.3", "hypothesis>=6.112", "ruff>=0.7", "pyright>=1.1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
addopts = "-v --strict-markers"
testpaths = ["tests"]
