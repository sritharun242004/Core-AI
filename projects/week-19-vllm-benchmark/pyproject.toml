[project]
name = "vllm-benchmark"
version = "0.1.0"
description = "Week 19 — offline inference contracts and explicit local-model benchmarks"
requires-python = ">=3.13"
dependencies = ["numpy>=2.1,<3"]

[project.optional-dependencies]
dev = ["pytest>=8.3", "ruff>=0.7"]
hf = ["torch>=2.6", "transformers>=4.49,<5"]
# Install a mutually compatible CUDA/torch/vLLM stack on the target host separately.
# vLLM wheels and Python support vary by release; it is never a baseline dependency.

[project.scripts]
vllm-benchmark = "vllm_benchmark.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
addopts = "-q --strict-markers"
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["src/vllm_benchmark"]
