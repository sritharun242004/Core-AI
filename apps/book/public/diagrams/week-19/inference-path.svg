<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 350" role="img" aria-labelledby="title desc">
  <title id="title">Inference path: scheduling, prefix reuse, paged KV, and observed tokens</title>
  <desc id="desc">An authenticated request enters admission and scheduling. A tenant-scoped exact-prefix lookup can provide KV page handles. The engine computes missing prefill and new decode tokens, updates or releases KV blocks, then emits tokens whose observation times define TTFT and TPOT. The whole benchmark window defines throughput. This is an architecture illustration, not a measured trace.</desc>
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#27624f"/></marker></defs>
  <rect width="960" height="350" rx="8" fill="#faf9f6"/>
  <g fill="#eef4ef" stroke="#27624f" stroke-width="1.5">
    <rect x="20" y="120" width="155" height="95" rx="4"/>
    <rect x="220" y="120" width="185" height="95" rx="4"/>
    <rect x="240" y="20" width="340" height="66" rx="4"/>
    <rect x="475" y="120" width="205" height="95" rx="4"/>
    <rect x="475" y="265" width="205" height="62" rx="4"/>
    <rect x="745" y="120" width="195" height="95" rx="4"/>
  </g>
  <g stroke="#27624f" stroke-width="2" fill="none" marker-end="url(#arrow)">
    <path d="M175 165 H220"/><path d="M405 165 H475"/>
    <path d="M312 120 V86"/><path d="M580 53 H710 V295 H680"/>
    <path d="M550 265 V215"/><path d="M610 215 V265"/>
    <path d="M680 165 H745"/>
  </g>
  <g font-family="system-ui, sans-serif" fill="#203b30" text-anchor="middle">
    <g font-size="17" font-weight="600">
      <text x="97" y="150">Request</text><text x="312" y="150">Admission</text>
      <text x="410" y="45">Exact-prefix index</text>
      <text x="577" y="150">Prefill / decode</text>
      <text x="577" y="290">KV block table</text>
      <text x="842" y="150">Token stream</text>
    </g>
    <g font-size="14">
      <text x="97" y="177">tenant + tokens</text>
      <text x="312" y="175">queue + batch</text><text x="312" y="195">+ prefill chunks</text>
      <text x="410" y="68">tenant / weights / tokenizer / adapter</text>
      <text x="577" y="176">weights + kernels</text><text x="577" y="196">missing work only</text>
      <text x="577" y="313">logical → physical pages</text>
      <text x="842" y="176">TTFT / TPOT</text><text x="842" y="196">wall-window throughput</text>
      <text x="512" y="242">read</text><text x="646" y="242">update</text>
    </g>
  </g>
  <text x="20" y="325" font-family="system-ui, sans-serif" font-size="13" fill="#465e52">Architecture only · not a measured trace</text>
</svg>
