[project]
name = "core-ai-book"
version = "0.1.0"
requires-python = ">=3.13"

[tool.uv.workspace]
members = ["projects/*"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]

[tool.pyright]
pythonVersion = "3.13"
typeCheckingMode = "strict"
