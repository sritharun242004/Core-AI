name: projects
on: [push, pull_request]
jobs:
  pytest:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv sync --locked --all-packages --extra dev
      - name: Isolated offline project suites
        run: uv run --no-sync python scripts/check-projects.py
      - run: uv run --no-sync ruff check projects/ scripts/check-projects.py
      - name: Strict typing (blocking; clean baseline since 2026-10-08)
        run: uv run --no-sync pyright projects/
