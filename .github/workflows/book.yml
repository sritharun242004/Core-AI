name: book
on: [push, pull_request]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 9 }
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: 'pnpm' }
      - run: pnpm install --frozen-lockfile
      - name: Vitest — unit tests
        run: pnpm --filter book run test:unit
      - name: Viz package — unit tests
        run: pnpm --filter @core-ai/viz test
      - name: Build book (includes pagefind postbuild)
        run: pnpm --filter book build
      - run: pnpm --filter book exec playwright install --with-deps chromium
      - name: Playwright — integration tests
        run: pnpm --filter book test
